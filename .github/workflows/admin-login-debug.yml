name: Admin Login Debug

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pages/admin/**'
      - 'src/contexts/AuthContext.tsx'
      - 'src/tests/admin-login.spec.ts'
      - 'playwright.config.ts'

jobs:
  admin-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run admin login flow test
        run: npx playwright test src/tests/admin-login.spec.ts --project=chromium
